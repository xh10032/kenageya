[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tohsaka"
version = "1.0.0"
description = "Graceful time management utility that always triggers 60 minutes ahead of target deadlines."
readme = { file = "README.md", content-type = "text/markdown; charset=UTF-8" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["tohsaka", "timer", "alarm", "schedule", "clock", "graceful"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/xh10032/kenageya"
Repository = "https://github.com/xh10032/kenageya"
Issues = "https://github.com/xh10032/kenageya/issues"

[project.scripts]
tohsaka = "tohsaka:main"

[tool.setuptools]
packages = ["tohsaka"]
