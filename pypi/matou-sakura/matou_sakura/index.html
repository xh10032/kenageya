function initAudio() {

    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return;
  audioCtx = new AudioCtx();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1;

  const convolver = audioCtx.createConvolver();
  const irLen = Math.floor(audioCtx.sampleRate * 0.28);
  const irBuf = audioCtx.createBuffer(2, irLen, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = irBuf.getChannelData(ch);
    for (let i = 0; i < irLen; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 3.6) * 0.15;
    }
  }
  convolver.buffer = irBuf;

  const dryGain = audioCtx.createGain();
  const wetGain = audioCtx.createGain();
  dryGain.gain.value = 0.88;
  wetGain.gain.value = 0.18;
  masterGain.connect(dryGain);
  masterGain.connect(convolver);
  convolver.connect(wetGain);
  dryGain.connect(audioCtx.destination);
  wetGain.connect(audioCtx.destination);

  const bufLen = audioCtx.sampleRate * 4;
  const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
  const pinkOut = noiseBuf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < bufLen; i++) {
    const white = Math.random() * 2 - 1;
    const grain = 0.85 + 0.15 * Math.sin(i * 0.008) * Math.cos(i * 0.0023);
    b0 = 0.99886 * b0 + white * 0.0555179;
    b1 = 0.99332 * b1 + white * 0.0750759;
    b2 = 0.96900 * b2 + white * 0.1538520;
    b3 = 0.86650 * b3 + white * 0.3104856;
    b4 = 0.55000 * b4 + white * 0.5329522;
    b5 = -0.7616 * b5 - white * 0.0168980;
    pinkOut[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.045 * grain;

  dragSubOsc.connect(dragSubGain);
  dragSubGain.connect(dragFilter);
  dragFilter.connect(dragGain);
  dragGain.connect(masterGain);
  dragOsc.start();
  dragSubOsc.start();

  const dragNoiseSrc = audioCtx.createBufferSource();
  dragNoiseSrc.buffer = noiseBuf;
  dragNoiseSrc.loop = true;

  dragNoiseFilter.type = 'bandpass';

  springOsc = audioCtx.createOscillator();

function trigGrab(f0 = 155, f1 = 92, vol = 0.722) {
  if (!audioCtx || !masterGain) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.exponentialRampToValueAtTime(f1, now + 0.055);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(0.08 * vol, now + 0.006);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.065);
}

function trigBagSnapRecoil(vol = 0.95) {
  if (!audioCtx || !masterGain) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;

  const whipOsc = audioCtx.createOscillator();
  const whipGain = audioCtx.createGain();
  whipOsc.type = 'sine';
  whipOsc.frequency.setValueAtTime(220, now);
  whipOsc.frequency.exponentialRampToValueAtTime(540, now + 0.022);
  whipGain.gain.setValueAtTime(0.0001, now);
  whipGain.gain.linearRampToValueAtTime(0.055 * vol, now + 0.008);
  whipGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.028);
  whipOsc.connect(whipGain);
  whipGain.connect(masterGain);
  whipOsc.start(now);
  whipOsc.stop(now + 0.03);

  const slapTime = now + 0.016;
  const slapDur = 0.065;
  const noiseLen = Math.max(1, Math.floor(audioCtx.sampleRate * slapDur));
  const slapBuf = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
  const slapData = slapBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) {
    const env = Math.pow(1 - i / noiseLen, 2.4);
    slapData[i] = (Math.random() * 2 - 1) * env;
  }

  const slapNoise = audioCtx.createBufferSource();
  slapNoise.buffer = slapBuf;
  const slapBandpass = audioCtx.createBiquadFilter();
  slapBandpass.type = 'bandpass';
  slapBandpass.frequency.setValueAtTime(1450, slapTime);
  slapBandpass.frequency.exponentialRampToValueAtTime(780, slapTime + 0.05);
  slapBandpass.Q.value = 1.65;

  const slapGain = audioCtx.createGain();
  slapGain.gain.setValueAtTime(0.0001, slapTime);
  slapGain.gain.linearRampToValueAtTime(0.26 * vol, slapTime + 0.002);
  slapGain.gain.exponentialRampToValueAtTime(0.0001, slapTime + 0.058);
  slapNoise.connect(slapBandpass);
  slapBandpass.connect(slapGain);
  slapGain.connect(masterGain);
  slapNoise.start(slapTime);
  slapNoise.stop(slapTime + slapDur);

  const popOsc = audioCtx.createOscillator();
  const popOverOsc = audioCtx.createOscillator();
  const popGain = audioCtx.createGain();
  const popOverGain = audioCtx.createGain();
  popOsc.type = 'triangle';
  popOsc.frequency.setValueAtTime(460, slapTime);
  popOsc.frequency.exponentialRampToValueAtTime(108, slapTime + 0.046);
  popOverOsc.type = 'sine';
  popOverOsc.frequency.setValueAtTime(920, slapTime);
  popOverOsc.frequency.exponentialRampToValueAtTime(210, slapTime + 0.032);
  popOverGain.gain.value = 0.38;

  popGain.gain.setValueAtTime(0.0001, slapTime);
  popGain.gain.linearRampToValueAtTime(0.18 * vol, slapTime + 0.002);
  popGain.gain.exponentialRampToValueAtTime(0.0001, slapTime + 0.055);
  popOsc.connect(popGain);
  popOverOsc.connect(popOverGain);
  popOverGain.connect(popGain);
  popGain.connect(masterGain);
  popOsc.start(slapTime);
  popOverOsc.start(slapTime);
  popOsc.stop(slapTime + 0.06);
  popOverOsc.stop(slapTime + 0.045);
}

function updateAudioFrame(state) {
  if (!audioCtx || !dragOsc || !dragSubOsc || !dragFilter || !dragGain || !dragNoiseFilter || !dragNoiseGain || !springOsc || !springOvOsc || !springFilter || !springGain || !springOvGain) {
    return;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const { ox, oy, vx, vy, dragging, dragVel } = state;
  const dragDist = Math.hypot(ox, oy);
  const springActive = !dragging && (Math.abs(ox) > 0.5 || Math.abs(oy) > 0.5 || Math.abs(vx) > 0.5 || Math.abs(vy) > 0.5);

  if (dragging) {
    if (!prevDrag) {
      prevDrag = true;
      trigGrab(155, 92, 0.722);
    }
    const tension = Math.min(1, dragDist / 220);
    const motion = Math.min(1, dragVel / 3.2);
    const activeMotion = Math.max(motion, tension > 0.04 ? 0.24 * tension : 0);
    dragOsc.frequency.setTargetAtTime(145 + tension * 155, now, 0.02);
    dragSubOsc.frequency.setTargetAtTime(290 + tension * 310, now, 0.02);
    dragFilter.frequency.setTargetAtTime(340 + tension * 320, now, 0.02);
    dragGain.gain.setTargetAtTime(activeMotion * (0.04 + tension * 0.075) * 0.78, now, 0.02);
    dragNoiseFilter.frequency.setTargetAtTime(520 + tension * 480, now, 0.02);
    dragNoiseGain.gain.setTargetAtTime(activeMotion * 0.048 * 0.78, now, 0.02);
  } else {
    prevDrag = false;
    dragGain.gain.setTargetAtTime(0, now, 0.025);
    dragNoiseGain.gain.setTargetAtTime(0, now, 0.025);
  }

  if (springActive) {
    const velMag = Math.hypot(vx, vy);
    const energy = Math.min(1, (velMag * 2.2 + dragDist * 0.4) / 95);
    const wobble = (ox - oy) * 0.48;
    const baseFreq = Math.max(160, Math.min(440, 285 + wobble * 1.35));
    springOsc.frequency.setTargetAtTime(baseFreq, now, 0.01);
    springOvOsc.frequency.setTargetAtTime(baseFreq * 2.02, now, 0.01);
    springFilter.type = 'lowpass';
    springFilter.frequency.setTargetAtTime(1100, now, 0.015);
    springOvGain.gain.setTargetAtTime(0.35, now, 0.015);
    springGain.gain.setTargetAtTime(energy * 0.11 * 0.722, now, 0.012);
  } else {
    springGain.gain.setTargetAtTime(0, now, 0.025);
  }
}

function tokenizeSvgPath(pathStr) {
  const tokens = [];
  const regex = /([a-zA-Z])|([-+]?(?:\d+\.?\d*|\.\d+))/g;
  let match = regex.exec(pathStr);
  while (match !== null) {
    tokens.push(match[1] ? match[1] : parseFloat(match[2]));
    match = regex.exec(pathStr);
  }
  return tokens;
}

function transformSvgPathAroundPivot(pathStr, pivot, angleRad, offsetX, offsetY, pointWeights) {
  if (Math.abs(angleRad) < 0.0001 && Math.abs(offsetX) < 0.01 && Math.abs(offsetY) < 0.01) {
    return pathStr;
  }
  const tokens = tokenizeSvgPath(pathStr);
  const out = [];
  let pairIndex = 0;
  let i = 0;
  while (i < tokens.length) {
    const tok = tokens[i];
    if (typeof tok === 'string') {
      out.push(tok);
      i++;
      continue;
    }
    if (i + 1 < tokens.length && typeof tokens[i + 1] === 'number') {
      const x = tok;
      const y = tokens[i + 1];
      const w = pointWeights && pairIndex < pointWeights.length ? pointWeights[pairIndex] : 1;
      pairIndex++;
      const wAngle = angleRad * w;
      const cosA = Math.cos(wAngle);
      const sinA = Math.sin(wAngle);
      const dx = x - pivot.x;
      const dy = y - pivot.y;
      const nx = pivot.x + dx * cosA - dy * sinA + offsetX * w;
      const ny = pivot.y + dx * sinA + dy * cosA + offsetY * w;
      out.push(nx.toFixed(2) + ',' + ny.toFixed(2));
      i += 2;
    } else {
      out.push(String(tok));
      i++;
    }
  }
  return out.join(' ');
}

function interpolateSvgPathArc(pathA, pathB, pivotA, pivotB, arcAngleDeg, t) {
  if (t <= 0.0001) return pathA;
  if (t >= 0.9999) return pathB;
  const tokensA = tokenizeSvgPath(pathA);
  const tokensB = tokenizeSvgPath(pathB);
  if (tokensA.length !== tokensB.length) {
    return t < 0.5 ? pathA : pathB;
  }
  const totalRad = (arcAngleDeg * Math.PI) / 180;
  const unrotCos = Math.cos(-totalRad);
  const unrotSin = Math.sin(-totalRad);
  const curRad = totalRad * t;
  const curCos = Math.cos(curRad);
  const curSin = Math.sin(curRad);
  const px = pivotA.x + (pivotB.x - pivotA.x) * t;
  const py = pivotA.y + (pivotB.y - pivotA.y) * t;
  const out = [];
  let i = 0;
  while (i < tokensA.length) {
    const tokA = tokensA[i];
    if (typeof tokA === 'string') {
      out.push(tokA);
      i++;
      continue;
    }
    if (i + 1 < tokensA.length && typeof tokensA[i + 1] === 'number' && typeof tokensB[i] === 'number' && typeof tokensB[i + 1] === 'number') {
      const xA = tokA;
      const yA = tokensA[i + 1];
      const xB = tokensB[i];
      const yB = tokensB[i + 1];
      const uA = xA - pivotA.x;
      const vA = yA - pivotA.y;
      const dxB = xB - pivotB.x;
      const dyB = yB - pivotB.y;
      const uB = dxB * unrotCos - dyB * unrotSin;
      const vB = dxB * unrotSin + dyB * unrotCos;
      const u = uA + (uB - uA) * t;
      const v = vA + (vB - vA) * t;
      const nx = px + u * curCos - v * curSin;
      const ny = py + u * curSin + v * curCos;
      out.push(nx.toFixed(2) + ',' + ny.toFixed(2));
      i += 2;
    } else {
      out.push(String(tokA));
      i++;
    }
  }
  return out.join(' ');
}

function sampleSvgPathSubpaths(pathStr, step = 4) {
  const tokens = tokenizeSvgPath(pathStr);
  const subpaths = [];
  let currentSubpath = null;

  function pushPoint(x, y) {
    if (!currentSubpath) {
      currentSubpath = { points: [{ x, y }], closed: false };
      subpaths.push(currentSubpath);
      return;
    }
    const pts = currentSubpath.points;
    if (pts.length === 0) {
      pts.push({ x, y });
      return;
    }
    const prev = pts[pts.length - 1];
    if (Math.hypot(x - prev.x, y - prev.y) > 0.25) {
      pts.push({ x, y });
    }
  }

  let i = 0;
  let cmd = '';
  let cx = 0;
  let cy = 0;
  let startX = 0;
  let startY = 0;

  while (i < tokens.length) {
    if (typeof tokens[i] === 'string') {
      cmd = tokens[i++];
    }
    const isRel = cmd === cmd.toLowerCase();
    const upper = cmd.toUpperCase();

    if (upper === 'M') {
      const rx = Number(tokens[i++]);
      const ry = Number(tokens[i++]);
      cx = isRel ? cx + rx : rx;
      cy = isRel ? cy + ry : ry;
      startX = cx;
      startY = cy;
      currentSubpath = { points: [{ x: cx, y: cy }], closed: false };
      subpaths.push(currentSubpath);
      cmd = isRel ? 'l' : 'L';
    } else if (upper === 'L') {
      const x0 = cx;
      const y0 = cy;
      const dx = Number(tokens[i++]);
      const dy = Number(tokens[i++]);
      cx = isRel ? cx + dx : dx;
      cy = isRel ? cy + dy : dy;
      const steps = Math.max(2, Math.ceil(Math.hypot(cx - x0, cy - y0) / step));
      for (let k = 1; k <= steps; k++) {
        const t = k / steps;
        pushPoint(x0 + (cx - x0) * t, y0 + (cy - y0) * t);
      }
    } else if (upper === 'Q') {
      const x0 = cx;
      const y0 = cy;
      const qxVal = Number(tokens[i++]);
      const qyVal = Number(tokens[i++]);
      const xVal = Number(tokens[i++]);
      const yVal = Number(tokens[i++]);
      const qx = isRel ? cx + qxVal : qxVal;
      const qy = isRel ? cy + qyVal : qyVal;
      const x = isRel ? cx + xVal : xVal;
      const y = isRel ? cy + yVal : yVal;
      cx = x;
      cy = y;
      const approxLen = Math.hypot(qx - x0, qy - y0) + Math.hypot(x - qx, y - qy);
      const steps = Math.max(4, Math.min(120, Math.ceil(approxLen / step)));
      for (let k = 1; k <= steps; k++) {
        const t = k / steps;
        const inv = 1 - t;
        pushPoint(inv * inv * x0 + 2 * inv * t * qx + t * t * x, inv * inv * y0 + 2 * inv * t * qy + t * t * y);
      }
    } else if (upper === 'C') {
      const x0 = cx;
      const y0 = cy;
      const c1xVal = Number(tokens[i++]);
      const c1yVal = Number(tokens[i++]);
      const c2xVal = Number(tokens[i++]);
      const c2yVal = Number(tokens[i++]);
      const xVal = Number(tokens[i++]);
      const yVal = Number(tokens[i++]);
      const c1x = isRel ? cx + c1xVal : c1xVal;
      const c1y = isRel ? cy + c1yVal : c1yVal;
      const c2x = isRel ? cx + c2xVal : c2xVal;
      const c2y = isRel ? cy + c2yVal : c2yVal;
      const x = isRel ? cx + xVal : xVal;
      const y = isRel ? cy + yVal : yVal;
      cx = x;
      cy = y;
      const approxLen = Math.hypot(c1x - x0, c1y - y0) + Math.hypot(c2x - c1x, c2y - c1y) + Math.hypot(x - c2x, y - c2y);
      const steps = Math.max(4, Math.min(140, Math.ceil(approxLen / step)));
      for (let k = 1; k <= steps; k++) {
        const t = k / steps;
        const inv = 1 - t;
        pushPoint(
          inv * inv * inv * x0 + 3 * inv * inv * t * c1x + 3 * inv * t * t * c2x + t * t * t * x,
          inv * inv * inv * y0 + 3 * inv * inv * t * c1y + 3 * inv * t * t * c2y + t * t * t * y
        );
      }
    } else if (upper === 'Z') {
      if (currentSubpath) {
        const x0 = cx;
        const y0 = cy;
        const dist = Math.hypot(startX - x0, startY - y0);
        if (dist > step) {
          const steps = Math.ceil(dist / step);
          for (let k = 1; k < steps; k++) {
            const t = k / steps;
            pushPoint(x0 + (startX - x0) * t, y0 + (startY - y0) * t);
          }
        }
        currentSubpath.closed = true;
      }
      cx = startX;
      cy = startY;
      cmd = '';
    } else {
      i++;
    }
  }
  return subpaths;
}

function computeIdleBagAndArmState(timeSec) {
  const cycleDuration = 5.6;
  const t = ((timeSec % cycleDuration) + cycleDuration) % cycleDuration;
  const slipDuration = 4.1;
  const liftPeakTime = 4.42;
  const liftEndTime = 4.82;
  const maxSlipY = 30;
  const maxSlipX = 2.8;
  const maxSlipRot = 1.65;

  if (t < slipDuration) {
    const u = t / slipDuration;
    const easeSlip = 0.35 * u + 0.65 * u * u;
    return {
      bagOffsetY: maxSlipY * easeSlip,
      bagOffsetX: maxSlipX * easeSlip,
      bagRotationDeg: maxSlipRot * easeSlip,
      armLiftY: 0,
      armLiftX: 0,
      phase: 'slipping'
    };
  }
  if (t < liftPeakTime) {
    const u = (t - slipDuration) / (liftPeakTime - slipDuration);
    const s = u * u * (3 - 2 * u);
    return {
      bagOffsetY: maxSlipY * (1 - s) - 11 * s,
      bagOffsetX: maxSlipX * (1 - s) - 1.2 * s,
      bagRotationDeg: maxSlipRot * (1 - s) - 0.8 * s,
      armLiftY: -15 * s,
      armLiftX: -2.0 * s,
      phase: 'lifting'
    };
  }
  if (t < liftEndTime) {
    const u = (t - liftPeakTime) / (liftEndTime - liftPeakTime);
    const s = u * u * (3 - 2 * u);
    return {
      bagOffsetY: -11 * (1 - s),
      bagOffsetX: -1.2 * (1 - s),
      bagRotationDeg: -0.8 * (1 - s),
      armLiftY: -15 * (1 - s),
      armLiftX: -2.0 * (1 - s),
      phase: 'lifting'
    };
  }
  return {
    bagOffsetY: 0,
    bagOffsetX: 0,
    bagRotationDeg: 0,
    armLiftY: 0,
    armLiftX: 0,
    phase: 'resting'
  };
}

function computeIdleAhogeState(timeSec) {

  const c1X = 877.82;

  const c2Y = 470.68;
  const tipX = 673.41;
  const tipY = 606.17;

  const slotDuration = 1.15;
  const slotIndex = Math.floor(Math.max(0, timeSec) / slotDuration);
  const slotLocalTime = ((timeSec % slotDuration) + slotDuration) % slotDuration;
  const hash = Math.abs(Math.sin((slotIndex + 1) * 12.9898 + 78.233) * 43758.5453) % 1;
  const isTwitchSlot = hash < 0.52;
  const isDoubleTwitch = hash < 0.24;
  const direction = hash > 0.26 ? 1 : -1;

  let twitchAngleDeg = 0;
  if (isTwitchSlot && slotLocalTime < 0.36) {
    const p = slotLocalTime / 0.36;
    const freq = isDoubleTwitch ? Math.PI * 4 : Math.PI * 2;
    const decay = Math.pow(1 - p, 1.85);
    const amp = isDoubleTwitch ? 4.2 : 3.1;
    twitchAngleDeg = direction * amp * Math.sin(p * freq) * decay;
  }

  const microAngleDeg = 0.22 * Math.sin(timeSec * 2.1) + 0.14 * Math.cos(timeSec * 3.4);
  const angleDeg = twitchAngleDeg + microAngleDeg;
  const rad = (angleDeg * Math.PI) / 180;
  const cosA = Math.cos(rad);
  const sinA = Math.sin(rad);

  const rotateAroundRoot = (px, py, weight) => {
    const dx = px - rootX;
    const dy = py - rootY;
    const rx = rootX + dx * cosA - dy * sinA;
    const ry = rootY + dx * sinA + dy * cosA;
    return {
      x: px + (rx - px) * weight,
      y: py + (ry - py) * weight
    };
  };

  const nc1 = rotateAroundRoot(c1X, c1Y, 0.45);
  const nc2 = rotateAroundRoot(c2X, c2Y, 0.88);
  const nTip = rotateAroundRoot(tipX, tipY, 1.0);
  return {
    pathD: 'M' + rootX.toFixed(2) + ',' + rootY.toFixed(2) + ' C' + nc1.x.toFixed(2) + ',' + nc1.y.toFixed(2) + ' ' + nc2.x.toFixed(2) + ',' + nc2.y.toFixed(2) + ' ' + nTip.x.toFixed(2) + ',' + nTip.y.toFixed(2)
  };
}

function computeIdleRibbonState(timeSec) {
  return {
    pivotX: 1585,
    pivotY: 688,
    rotationDeg: 1.35 * Math.sin(timeSec * 1.65) + 0.55 * Math.sin(timeSec * 2.85 + 0.9),
    swayX: 1.95 * Math.sin(timeSec * 1.65 - 0.4),
    swayY: 1.35 * Math.cos(timeSec * 2.2 + 0.3)
  };
}

function computeIdleEyesBlinkTwitchState(timeSec, mode, weight = 1) {
  const w = Math.max(0, Math.min(1, weight));
  if (mode === 'inactive' || w <= 0.001) {
    return {
      pivotY: EYE_SCRIBBLE_PIVOT_Y,
      isBlinking: false,
      offsetY: 0,
      scaleY: 1,
      strokeOffsetsY: [0, 0, 0, 0, 0, 0, 0]
    };
  }
  const isSnatchedMode = mode === 'snatched-idle';
  const slotDuration = isSnatchedMode ? 1.95 : 2.45;
  const safeTime = Math.max(0, timeSec);
  const slotIndex = Math.floor(safeTime / slotDuration);
  const slotLocalTime = ((safeTime % slotDuration) + slotDuration) % slotDuration;
  const hash = Math.abs(Math.sin((slotIndex + 3) * 19.173 + (isSnatchedMode ? 41.7 : 13.5)) * 43758.5453) % 1;
  const modPattern = slotIndex % 2 === 1 && (isSnatchedMode ? hash < 0.82 : hash < 0.74);
  const isDoubleBlink = isSnatchedMode ? hash < 0.28 : hash < 0.18;
  const startDelay = 0.18 + hash * 0.42;
  const blinkDuration = isDoubleBlink ? 0.28 : 0.15;
  const elapsedInBlink = slotLocalTime - startDelay;

  if (!modPattern || elapsedInBlink < 0 || elapsedInBlink >= blinkDuration) {
    return {
      pivotY: EYE_SCRIBBLE_PIVOT_Y,
      isBlinking: false,
      offsetY: 0,
      scaleY: 1,
      strokeOffsetsY: [0, 0, 0, 0, 0, 0, 0]
    };
  }

  const p = elapsedInBlink / blinkDuration;
  let pulseU = -1;
  if (!isDoubleBlink) {
    pulseU = p;
  } else if (p <= 0.42) {
    pulseU = p / 0.42;
  } else if (p >= 0.58) {
    pulseU = (p - 0.58) / 0.42;
  }

  if (pulseU < 0 || pulseU > 1) {
    return {
      pivotY: EYE_SCRIBBLE_PIVOT_Y,
      isBlinking: true,
      offsetY: 0,
      scaleY: 1,
      strokeOffsetsY: [0, 0, 0, 0, 0, 0, 0]
    };
  }

  const ampMult = (isSnatchedMode ? 1.12 : 1.0) * w;
  const env = Math.sin(pulseU * Math.PI);
  const bounceWave = Math.sin(pulseU * Math.PI * 2.0);
  const offsetY = 3.2 * env * bounceWave * ampMult;
  const pinchWave = -Math.sin(pulseU * Math.PI * 2.0);
  const scaleY = 1 + 0.045 * env * pinchWave * ampMult;
  const strokeSigns = [-1.0, 1.0, -0.8, 1.0, -0.9, 0.85, -0.85];
  const strokeOffsetsY = strokeSigns.map((sign) => sign * 0.95 * env * bounceWave * ampMult);

  return {
    pivotY: EYE_SCRIBBLE_PIVOT_Y,
    isBlinking: true,
    offsetY,
    scaleY,
    strokeOffsetsY
  };
}

function deformFacePoint(x, y, ox, oy, scale = 1) {
  if (Math.abs(ox) < 0.001 && Math.abs(oy) < 0.001) {
    return { x, y };
  }
  const { Y_TOP, Y_FULL_START, Y_FULL_END, Y_BOTTOM, X_LEFT, X_PEAK, X_RIGHT } = FACE_DEFORM_BOUNDS;
  if (y < Y_TOP || y > Y_BOTTOM || x < X_LEFT || x > X_RIGHT) {
    return { x, y };
  }
  let wy = 1;
  if (y < Y_FULL_START) {
    const ty = (y - Y_TOP) / (Y_FULL_START - Y_TOP);
    wy = ty * ty * (3 - 2 * ty);
  } else if (y > Y_FULL_END) {
    const ty = (Y_BOTTOM - y) / (Y_BOTTOM - Y_FULL_END);
    wy = ty * ty * (3 - 2 * ty);
  }
  let wx = 0;
  let belly = 0;
  if (x <= X_PEAK) {
    const tx = (x - X_LEFT) / (X_PEAK - X_LEFT);
    wx = tx * tx * (3 - 2 * tx);
  } else {
    const u = (x - X_PEAK) / (X_RIGHT - X_PEAK);
    if (u < 1) {
      wx = 1 - u + 0.32 * u * (1 - u);
      belly = 4 * u * (1 - u) * (1 - 0.25 * u);
    }
  }
  const w = wx * wy * scale;
  const b = belly * wy * scale;
  const pull = Math.max(0, -ox * 0.48) + Math.max(0, oy * 0.52);
  return {
    x: x + ox * w + pull * b * 0.18,
    y: y + oy * w + pull * b * 0.58
  };
}

function restJawlineY(x0) {
  if (x0 <= 1135.42) {
    const u = (x0 - 1075) / 60.42;
    return 1068.85 - 3.51 * u * u;
  }
  const v = (x0 - 1135.42) / 200;
  return 1065.34 - 38.0 * v - 22.0 * v * v;
}

function computeCollarJawRise(ox, oy) {
  if (oy >= -0.001) return 0;
  let x0 = Math.max(980, Math.min(1340, LEFT_COLLAR_TIP_X - ox * 0.62));
  const p1 = deformFacePoint(x0, restJawlineY(x0), ox, oy, 1);
  x0 = Math.max(980, Math.min(1340, x0 + (LEFT_COLLAR_TIP_X - p1.x)));
  const p2 = deformFacePoint(x0, restJawlineY(x0), ox, oy, 1);
  const jawRiseAtLeftCollar = Math.max(0, REST_JAW_Y_AT_LEFT_COLLAR - p2.y);
  const effectiveUpOy = Math.max(0, -oy - Math.max(0, -ox) * 0.35);
  return Math.max(jawRiseAtLeftCollar, effectiveUpOy * 0.65);
}

function deformCollarPoint(x, y, ox, oy) {
  const jawRise = computeCollarJawRise(ox, oy);
  if (jawRise <= 0.001) return { x, y };
  const { Y_TOP, Y_FULL_START, Y_FULL_END, Y_BOTTOM, X_LEFT, X_FULL_START, X_FULL_END, X_RIGHT } = COLLAR_DEFORM_BOUNDS;
  if (y < Y_TOP || y > Y_BOTTOM || x < X_LEFT || x > X_RIGHT) {
    return { x, y };
  }
  let wy = 1;
  if (y < Y_FULL_START) {
    const ty = (y - Y_TOP) / (Y_FULL_START - Y_TOP);
    wy = ty * ty * (3 - 2 * ty);
  } else if (y > Y_FULL_END) {
    const ty = (Y_BOTTOM - y) / (Y_BOTTOM - Y_FULL_END);
    wy = ty * ty * (3 - 2 * ty);
  }
  let wx = 1;
  if (x < X_FULL_START) {
    const tx = (x - X_LEFT) / (X_FULL_START - X_LEFT);
    wx = tx * tx * (3 - 2 * tx);
  } else if (x > X_FULL_END) {
    const tx = (X_RIGHT - x) / (X_RIGHT - X_FULL_END);
    wx = tx * tx * (3 - 2 * tx);
  }
  const weight = wx * wy;
  if (weight <= 0.0001) return { x, y };
  const collarUpDy = -(jawRise * 1.15 + Math.min(6.5, jawRise * 0.25));
  const clampedOx = Math.max(-45, Math.min(45, ox));
  const collarDx = clampedOx * 0.028 * Math.min(1, jawRise / 25) * weight;
  return {
    x: x + collarDx,
    y: y + collarUpDy * weight
  };
}

function computeUpwardCheekCollarShift(ox, oy) {
  const jawRise = computeCollarJawRise(ox, oy);
  if (jawRise <= 0.001) return { x: 0, y: 0 };
  const clampedOx = Math.max(-45, Math.min(45, ox));
  return {
    x: clampedOx * 0.022 * Math.min(1, jawRise / 25),
    y: -jawRise * 0.36
  };
}

function softMapDragOffset(dx, dy) {
  const r = Math.hypot(dx, dy);
  if (r < 0.001) return { x: 0, y: 0 };
  const ux = dx / r;
  const uy = dy / r;
  const dot = ux * -0.52 + uy * 0.85;
  const t = Math.pow((dot + 1) * 0.5, 1.15);
  const scale = 16 + 314 * t;
  const mappedR = scale * (1 - 1 / Math.pow(1 + r / (scale * 0.78), 0.85));
  return { x: ux * mappedR, y: uy * mappedR };
}

function stepSpringPhysics(state) {
  const nextDragVel = state.dragVel * 0.82;
  if (state.dragging) {
    return { ...state, dragVel: nextDragVel };
  }
  if (Math.abs(state.ox) > 0.05 || Math.abs(state.oy) > 0.05 || Math.abs(state.vx) > 0.05 || Math.abs(state.vy) > 0.05) {
    let vx = (state.vx - state.ox * 0.22) * 0.8;
    let vy = (state.vy - state.oy * 0.22) * 0.8;
    let ox = state.ox + vx;
    let oy = state.oy + vy;
    if (Math.abs(ox) <= 0.05 && Math.abs(oy) <= 0.05 && Math.abs(vx) <= 0.05 && Math.abs(vy) <= 0.05) {
      ox = 0;
      oy = 0;
      vx = 0;
      vy = 0;
    }
    return { ...state, ox, oy, vx, vy, dragVel: nextDragVel };
  }
  return { ...state, ox: 0, oy: 0, vx: 0, vy: 0, dragVel: nextDragVel };
}

function stepEntranceSpringPhysics(state) {
  if (state.waitingForClick) {
    return { waitingForClick: true, active: false, scaleY: 0, scaleX: 1, velocityY: 0 };
  }
  if (!state.active) {
    return { waitingForClick: false, active: false, scaleY: 1, scaleX: 1, velocityY: 0 };
  }
  const disp = state.scaleY - 1;
  const nextVy = (state.velocityY - disp * 0.22) * 0.8;
  const nextScaleY = Math.max(0, state.scaleY + nextVy);
  const nextDisp = nextScaleY - 1;
  if (Math.abs(nextDisp) <= 0.0015 && Math.abs(nextVy) <= 0.0015) {
    return { waitingForClick: false, active: false, scaleY: 1, scaleX: 1, velocityY: 0 };
  }
  return {
    waitingForClick: false,
    active: true,
    scaleY: nextScaleY,
    scaleX: 1 - nextDisp * 0.24,
    velocityY: nextVy
  };
}

function entranceStateToAudioSpringState(state) {
  if (!state.active || state.waitingForClick) {
    return { ox: 0, oy: 0, vx: 0, vy: 0, dragging: false, dragVel: 0 };
  }
  const disp = state.scaleY - 1;
  const vel = state.velocityY;
  return {
    ox: disp * 135,
    oy: -disp * 135,
    vx: vel * 135,
    vy: -vel * 135,
    dragging: false,
    dragVel: 0
  };
}

function isPointNearCheekGrabZone(ptX, ptY, ox, oy, radius = CHEEK_GRAB_RADIUS) {
  const anchor = deformFacePoint(CHEEK_GRAB_ANCHOR.x, CHEEK_GRAB_ANCHOR.y, ox, oy, 1);
  const junction = deformFacePoint(CHEEK_CLOTHING_JUNCTION_ANCHOR.x, CHEEK_CLOTHING_JUNCTION_ANCHOR.y, ox, oy, 1);
  const dx = ptX - anchor.x;
  const dy = ptY - anchor.y;
  if (dx < -radius * 0.82 || dy < -radius * 0.82) return false;
  if (ptY > Math.max(anchor.y + radius * 1.65, junction.y + radius * 0.52)) return false;
  if (dx <= radius * 1.12 && dy <= radius * 1.65) {
    const normY = dy > 0 ? dy / 1.62 : dy;
    if (Math.hypot(dx / 1.05, normY) <= radius) return true;
  }
  const segX = junction.x - anchor.x;
  const segY = junction.y - anchor.y;
  const segLenSq = Math.max(1, segX * segX + segY * segY);
  const t = Math.max(0, Math.min(1, (dx * segX + dy * segY) / segLenSq));
  const closestX = anchor.x + t * segX;
  const closestY = anchor.y + t * segY;
  const corridorRadius = radius * (0.94 - 0.1 * t);
  return Math.hypot(ptX - closestX, ptY - closestY) <= corridorRadius;
}

function isPointNearPlasticBagGrabZone(ptX, ptY, idleBagOffsetY = 0, tugProgress = 0) {
  if (isPointNearCheekGrabZone(ptX, ptY, 0, 0)) return false;
  const restCx = BAG_REST_GRAB_CENTER.x;
  const restCy = BAG_REST_GRAB_CENTER.y + idleBagOffsetY * (1 - tugProgress);
  if (Math.hypot((ptX - restCx) / 155, (ptY - restCy) / 168) <= 1.0) return true;
  if (tugProgress > 0.12) {
    const interpCx = BAG_REST_GRAB_CENTER.x + (BAG_TUG_GRAB_CENTER.x - BAG_REST_GRAB_CENTER.x) * tugProgress;
    const interpCy = BAG_REST_GRAB_CENTER.y + (BAG_TUG_GRAB_CENTER.y - BAG_REST_GRAB_CENTER.y) * tugProgress;
    if (Math.hypot((ptX - interpCx) / 175, (ptY - interpCy) / 160) <= 1.0) return true;
  }
  return false;
}

function isPointNearBagReturnZone(ptX, ptY, rx = 165, ry = 155) {
  const dx = (ptX - BAG_RETURN_ZONE_CENTER.x) / rx;
  const dy = (ptY - BAG_RETURN_ZONE_CENTER.y) / ry;
  return Math.hypot(dx, dy) <= 1.0;
}

function computeTuckedHandsFidgetState(timeSec, pose1To2Progress = 1) {
  const weightRaw = Math.max(0, Math.min(1, (pose1To2Progress - 0.5) / 0.5));
  const weight = weightRaw * weightRaw * (3 - 2 * weightRaw);
  if (weight <= 0.0001) {
    return {
      tapPulse: 0,
      leftPivot: POSE2_LEFT_SHOULDER_PIVOT,
      rightPivot: POSE2_RIGHT_SHOULDER_PIVOT,
      leftDx: 0,
      leftDy: 0,
      leftRotDeg: 0,
      rightDx: 0,
      rightDy: 0,
      rightRotDeg: 0
    };
  }
  const cyclePeriod = 1.45;
  const phase = ((timeSec % cyclePeriod) + cyclePeriod) % cyclePeriod;
  const u = phase / cyclePeriod;
  let rawTap = 0;
  if (u >= 0.04 && u < 0.34) {
    rawTap = Math.pow(Math.sin(((u - 0.04) / 0.30) * Math.PI), 1.45);
  } else if (u >= 0.38 && u < 0.68) {
    rawTap = Math.pow(Math.sin(((u - 0.38) / 0.30) * Math.PI), 1.45);
  } else {
    rawTap = 0.08 + 0.05 * Math.sin(timeSec * 14.0);
  }
  const tapPulse = Math.max(0, Math.min(1, rawTap)) * weight;
  return {
    tapPulse,
    leftPivot: POSE2_LEFT_SHOULDER_PIVOT,
    rightPivot: POSE2_RIGHT_SHOULDER_PIVOT,
    leftDx: 7.4 * tapPulse,
    leftDy: 3.2 * tapPulse,
    leftRotDeg: -4.4 * tapPulse,
    rightDx: -7.4 * tapPulse,
    rightDy: 3.2 * tapPulse,
    rightRotDeg: 4.4 * tapPulse
  };
}

function computeStage1ArmAndBagPose(swingP, preSwingDy = 0) {
  const s = Math.max(0, Math.min(1, swingP));
  const armPivotX = POSE3_RIGHT_ARM_PIVOT.x + (POSE4_RIGHT_ARM_PIVOT.x - POSE3_RIGHT_ARM_PIVOT.x) * s;
  const armPivotY = POSE3_RIGHT_ARM_PIVOT.y + (POSE4_RIGHT_ARM_PIVOT.y - POSE3_RIGHT_ARM_PIVOT.y) * s + preSwingDy;
  const armRotationDeg = POSE3_TO_POSE4_RIGHT_ARM_ROT_DEG * s;
  const armRad = (armRotationDeg * Math.PI) / 180;
  const cosArm = Math.cos(armRad);
  const sinArm = Math.sin(armRad);
  const u0x = BAG1_HANDLE_APEX.x - POSE3_RIGHT_ARM_PIVOT.x;
  const u0y = BAG1_HANDLE_APEX.y - POSE3_RIGHT_ARM_PIVOT.y;
  const u1x = 17.9905;
  const u1y = 71.4317;
  const ux = u0x + (u1x - u0x) * s;
  const uy = u0y + (u1y - u0y) * s;
  const bagHandleX = armPivotX + ux * cosArm - uy * sinArm;
  const bagHandleY = armPivotY + ux * sinArm + uy * cosArm;
  const bagRotationDeg = BAG1_TO_BAG3_ROT_DEG * s;
  const upperStrapOverlayAlpha = s <= 0.45 ? 1 : s >= 0.82 ? 0 : 1 - (s - 0.45) / (0.82 - 0.45);
  return {
    armPivotX,
    armPivotY,
    armRotationDeg,
    bagHandleX,
    bagHandleY,
    bagRotationDeg,
    upperStrapOverlayAlpha
  };
}

function computeBagTugConstraint(dx, dy, alreadyCrossed = false) {
  if (dx >= -4) {
    return {
      isValidLeftPull: false,
      targetPreSwing: 0,
      hasCrossedCenter: false,
      targetProgress: 0,
      targetAngleDeg: 0,
      pullTension: 0,
      pullForce: 0,
      resistanceFactor: 0,
      userPullOffsetX: 0,
      userPullOffsetY: 0
    };
  }
  const leftDist = -dx;
  const absDy = Math.abs(dy);
  const slopeRatio = absDy / Math.max(1, leftDist);
  if (slopeRatio > 2.45) {
    return {
      isValidLeftPull: false,
      targetPreSwing: 0,
      hasCrossedCenter: false,
      targetProgress: 0,
      targetAngleDeg: 0,
      pullTension: 0,
      pullForce: 0,
      resistanceFactor: 0,
      userPullOffsetX: 0,
      userPullOffsetY: 0
    };
  }
  const coneFactor = slopeRatio <= 1.45 ? 1 : Math.max(0, 1 - (slopeRatio - 1.45) / (2.45 - 1.45));
  const directionalLeftDist = Math.hypot(leftDist, absDy * 0.72);
  const effectiveLeftDist = directionalLeftDist * coneFactor;
  if (effectiveLeftDist < 4) {
    return {
      isValidLeftPull: false,
      targetPreSwing: 0,
      hasCrossedCenter: false,
      targetProgress: 0,
      targetAngleDeg: 0,
      pullTension: 0,
      pullForce: 0,
      resistanceFactor: 0,
      userPullOffsetX: 0,
      userPullOffsetY: 0
    };
  }
  const rawPreSwing = Math.min(1, Math.max(0, (effectiveLeftDist - 4) / (BAG_BODY_CENTER_THRESHOLD_DX - 4)));
  const targetPreSwing = 1 - Math.pow(1 - rawPreSwing, 1.35);
  const hasCrossedCenter = alreadyCrossed
    ? effectiveLeftDist >= BAG_STAGE2_HOLD_THRESHOLD_DX
    : effectiveLeftDist >= BAG_BODY_CENTER_THRESHOLD_DX;
  const targetProgress = hasCrossedCenter ? 1 : 0;
  const stage2ExcessDist = Math.max(0, effectiveLeftDist - BAG_STAGE2_HOLD_THRESHOLD_DX);
  const pullTension = hasCrossedCenter ? Math.min(1, stage2ExcessDist / (stage2ExcessDist + 115)) : 0;
  const pullForce = hasCrossedCenter ? Math.min(1, Math.pow(stage2ExcessDist / 380, 1.35)) : 0;
  const resistanceFactor = hasCrossedCenter
    ? Math.min(1, Math.pow(stage2ExcessDist / 240, 1.45))
    : Math.min(0.25, rawPreSwing * 0.25);
  const dragAngleDeg = (Math.atan2(-dy, Math.max(30, leftDist)) * 180) / Math.PI;
  const targetAngleDeg = Math.max(-25, Math.min(22, dragAngleDeg * 0.85));
  const maxYield = (24 * Math.log1p(stage2ExcessDist / 52)) / Math.log1p(300 / 52);
  const clampedYield = hasCrossedCenter ? Math.min(26, maxYield) : 0;
  const userPullOffsetX = -clampedYield;
  const userPullOffsetY = Math.max(-3, Math.min(15, (dy / Math.max(35, leftDist)) * clampedYield * 0.58));
  return {
    isValidLeftPull: true,
    targetPreSwing,
    hasCrossedCenter,
    targetProgress,
    targetAngleDeg,
    pullTension,
    pullForce,
    resistanceFactor,
    userPullOffsetX,
    userPullOffsetY
  };
}

function returnSnatchedBagState(state) {

  };
}

function stepBagTugPhysics(state, timeSec, dt = 1 / 60) {
  const safeDt = Math.max(0.001, Math.min(0.1, dt));

  if (state.returning) {
    const prevElapsed = state.returnElapsedSec || 0;
    const nextElapsed = prevElapsed + safeDt;
    const receiveEnd = 0.34;
    const happyEnd = 1.48;
    const idleTransitionEnd = 2.18;

    if (nextElapsed >= idleTransitionEnd) {
      return {
        ...state,
        returning: false,
        returnElapsedSec: idleTransitionEnd,
        returnPhase: 'none',
        happyFxProgress: 0,
        returnBlushProgress: 1,
        returnToIdleProgress: 1,
        bagStretchRatio: 1,
        bagSquashRatio: 1,
        sakuraBraceX: 0,
        sakuraBraceY: 0
      };
    }

    let returnPhase = 'receiving';
    if (nextElapsed >= happyEnd) {
      returnPhase = 'transition-to-idle';
    } else if (nextElapsed >= receiveEnd) {
      returnPhase = 'happy-fx';
    }

    const rawBlush = nextElapsed <= receiveEnd ? 0 : Math.min(1, (nextElapsed - receiveEnd) / 0.24);
    const returnBlushProgress = rawBlush * rawBlush * (3 - 2 * rawBlush);

    let happyFxProgress = 0;
    if (nextElapsed > receiveEnd && nextElapsed <= happyEnd) {
      const popIn = Math.min(1, (nextElapsed - receiveEnd) / 0.2);
      happyFxProgress = popIn * popIn * (3 - 2 * popIn);
    } else if (nextElapsed > happyEnd) {
      const fadeOut = Math.max(0, 1 - (nextElapsed - happyEnd) / 0.45);
      happyFxProgress = fadeOut * fadeOut * (3 - 2 * fadeOut);
    }

    const rawIdle = nextElapsed <= happyEnd ? 0 : Math.min(1, (nextElapsed - happyEnd) / (idleTransitionEnd - happyEnd));
    const returnToIdleProgress = rawIdle * rawIdle * (3 - 2 * rawIdle);

    return {
      ...state,
      returning: true,
      returnElapsedSec: nextElapsed,
      returnPhase,
      happyFxProgress,
      returnBlushProgress,
      returnToIdleProgress,
      bagStretchRatio: 1,
      bagSquashRatio: 1,
      sakuraBraceX: 0,
      sakuraBraceY: 0
    };
  }

  if (state.snatched) {
    const prevElapsed = state.snatchElapsedSec || 0;
    const nextElapsed = prevElapsed + safeDt;
    const raiseDur = 0.28;
    const holdEnd = 0.88;
    const tuckEnd = 1.42;

    const rawRaise = Math.min(1, Math.max(0, nextElapsed / raiseDur));
    const pose4ToPose1Progress = rawRaise * rawRaise * (3 - 2 * rawRaise);
    const rawTuck = nextElapsed <= holdEnd ? 0 : Math.min(1, (nextElapsed - holdEnd) / (tuckEnd - holdEnd));
    const pose1ToPose2Progress = rawTuck * rawTuck * (3 - 2 * rawTuck);
    const rawSweat = nextElapsed <= holdEnd + 0.08 ? 0 : Math.min(1, (nextElapsed - (holdEnd + 0.08)) / 0.35);
    const sweatDropProgress = rawSweat * rawSweat * (3 - 2 * rawSweat);

    let postSnatchPhase = 'raising';
    if (nextElapsed >= tuckEnd) {
      postSnatchPhase = 'tucked';
    } else if (nextElapsed > holdEnd) {
      postSnatchPhase = 'tucking';
    } else if (nextElapsed >= raiseDur) {
      postSnatchPhase = 'raised-hold';
    }

    const targetBagX = state.pointerX ?? state.snatchedBagX ?? BAG_TUG_GRAB_CENTER.x - 120;
    const targetBagY = state.pointerY ?? state.snatchedBagY ?? BAG_TUG_GRAB_CENTER.y;
    const prevBagX = state.snatchedBagX ?? targetBagX;
    const prevBagY = state.snatchedBagY ?? targetBagY;
    const snapBoost = nextElapsed < 0.16 ? 28 : 18;
    const followAlpha = Math.min(1, safeDt * snapBoost);
    const nextBagX = prevBagX + (targetBagX - prevBagX) * followAlpha;
    const nextBagY = prevBagY + (targetBagY - prevBagY) * followAlpha;
    const instVelX = (nextBagX - prevBagX) / safeDt;
    const prevVelX = state.snatchedBagVelX ?? 0;
    const nextVelX = prevVelX * 0.8 + instVelX * 0.2;

    const swayDeg = Math.max(-14, Math.min(14, -nextVelX * 0.008));
    const targetUprightDeg = BAG1_VERTICAL_UPRIGHT_ROT_DEG + swayDeg;
    const prevAngle = state.snatchedBagAngleDeg ?? (BAG1_TO_BAG3_ROT_DEG + state.bagAngleDeg);
    const nextBagAngleDeg = prevAngle + (targetUprightDeg - prevAngle) * Math.min(1, safeDt * 14);

    const recoilDecay = Math.exp(-nextElapsed * 14.5);
    const recoilWave = Math.cos(nextElapsed * 56.0);
    const rawRecoilStretch = 1 + 0.28 * recoilDecay * recoilWave;
    const nextBagStretchRatio = nextElapsed >= 0.34 || Math.abs(rawRecoilStretch - 1) < 0.003 ? 1 : rawRecoilStretch;
    const nextBagSquashRatio = nextBagStretchRatio === 1 ? 1 : 1 / Math.pow(Math.max(0.7, nextBagStretchRatio), 0.48);

    const nextBraceX = state.sakuraBraceX * Math.pow(0.12, safeDt * 10);
    const nextBraceY = state.sakuraBraceY * Math.pow(0.12, safeDt * 10);

    return {
      ...state,
      snatched: true,
      snatchElapsedSec: nextElapsed,
      postSnatchPhase,
      pose4ToPose1Progress,
      pose1ToPose2Progress,
      sweatDropProgress,
      snatchedBagX: nextBagX,
      snatchedBagY: nextBagY,
      snatchedBagVelX: nextVelX,
      snatchedBagAngleDeg: nextBagAngleDeg,
      bagStretchRatio: nextBagStretchRatio,
      bagSquashRatio: nextBagSquashRatio,
      sakuraBraceX: Math.abs(nextBraceX) < 0.05 ? 0 : nextBraceX,
      sakuraBraceY: Math.abs(nextBraceY) < 0.05 ? 0 : nextBraceY,
      pullTension: 0,
      pullForce: 0
    };
  }

  const constraint = state.dragging
    ? computeBagTugConstraint(state.rawDx, state.rawDy, state.crossedCenter)
    : {
        isValidLeftPull: false,
        targetPreSwing: 0,
        hasCrossedCenter: false,
        targetProgress: 0,
        targetAngleDeg: 0,
        pullTension: 0,
        pullForce: 0,
        resistanceFactor: 0,
        userPullOffsetX: 0,
        userPullOffsetY: 0
      };

  const canEngageStage2 = constraint.hasCrossedCenter && (state.progress > 0.05 || state.preSwingProgress >= 0.85);
  const effectiveTargetProgress = canEngageStage2 ? constraint.targetProgress : 0;
  const frameSteps = Math.max(1, safeDt * 60);
  const baseDiffSmoothing = state.dragging ? 0.26 : 0.35;
  const diffSmoothing = 1 - Math.pow(1 - baseDiffSmoothing, frameSteps);
  let nextProgress = state.progress + (effectiveTargetProgress - state.progress) * diffSmoothing;
  if (!state.dragging && nextProgress < 0.004) nextProgress = 0;

  const effectiveTargetPreSwing = nextProgress >= 0.25 ? 1 : constraint.targetPreSwing;
  const basePreSwingSmoothing = state.dragging ? 0.25 : 0.16;
  const preSwingSmoothing = 1 - Math.pow(1 - basePreSwingSmoothing, frameSteps);
  let nextPreSwing = state.preSwingProgress + (effectiveTargetPreSwing - state.preSwingProgress) * preSwingSmoothing;
  if (!state.dragging && nextProgress === 0 && nextPreSwing < 0.004) nextPreSwing = 0;

  const targetPreDy = state.dragging && constraint.isValidLeftPull ? Math.max(-8, Math.min(8, state.rawDy * 0.08)) * nextPreSwing : 0;
  let nextPreDy = state.preSwingDy + (targetPreDy - state.preSwingDy) * 0.22;
  if (!state.dragging && Math.abs(nextPreDy) < 0.05) nextPreDy = 0;

  let nextAngleDeg = state.bagAngleDeg + (constraint.targetAngleDeg - state.bagAngleDeg) * 0.2;
  if (!state.dragging && Math.abs(nextAngleDeg) < 0.04) nextAngleDeg = 0;

  const nextTension = state.pullTension + (constraint.pullTension - state.pullTension) * 0.22;
  const prevForce = state.pullForce || 0;
  const nextForce = prevForce + (constraint.pullForce - prevForce) * 0.22;
  const prevResistance = state.resistanceFactor || 0;
  const nextResistance = prevResistance + (constraint.resistanceFactor - prevResistance) * 0.22;

  let counterYankX = 0;
  let counterYankY = 0;
  let struggleAngleOffsetDeg = 0;
  let sakuraBraceX = 0;
  let sakuraBraceY = 0;
  let yankStretchPulse = 0;

  if (nextProgress > 0.15) {
    const activeStrength = Math.min(1, (nextProgress - 0.15) / 0.85) * (0.45 + 0.55 * nextTension + 0.45 * nextResistance);
    const pulseWave = Math.pow(0.5 + 0.5 * Math.sin(timeSec * 8.4), 3.2);
    const secondaryWave = 0.5 + 0.5 * Math.sin(timeSec * 13.5 + 1.1);
    const tremorX = Math.sin(timeSec * 31.0) * (1.5 + 1.4 * nextResistance) * activeStrength;
    const tremorY = Math.cos(timeSec * 27.0) * (1.1 + 1.0 * nextResistance) * activeStrength;

    counterYankX = (pulseWave * (13.5 + 4.5 * nextResistance) + secondaryWave * 4.5) * activeStrength + tremorX;
    counterYankY = -(pulseWave * 5.0 + secondaryWave * 1.9) * activeStrength + tremorY;
    struggleAngleOffsetDeg = (pulseWave * 2.6 - secondaryWave * 1.2 + Math.sin(timeSec * 24.0) * 0.75) * activeStrength;
    sakuraBraceX = (3.8 + pulseWave * 4.6) * activeStrength;
    sakuraBraceY = (1.1 + pulseWave * 1.8) * activeStrength;
    yankStretchPulse = (0.042 * pulseWave + 0.015 * secondaryWave) * activeStrength;
  }

  const netOffsetX = constraint.userPullOffsetX * nextProgress + counterYankX;
  const netOffsetY = constraint.userPullOffsetY * nextProgress + counterYankY;

  let nextHighForceHoldSec = state.highForceHoldSec || 0;
  if (state.dragging && constraint.hasCrossedCenter && constraint.pullForce >= SNATCH_FORCE_THRESHOLD) {
    const normalizedExcessForce = (constraint.pullForce - SNATCH_FORCE_THRESHOLD) / (1 - SNATCH_FORCE_THRESHOLD);
    const chargeRate = 0.55 + 0.65 * Math.max(0, Math.min(1, normalizedExcessForce));
    nextHighForceHoldSec += safeDt * chargeRate;
  } else {
    nextHighForceHoldSec = Math.max(0, nextHighForceHoldSec - safeDt * 1.65);
  }

  const chargeRatio = Math.min(1, nextHighForceHoldSec / SNATCH_HOLD_DURATION_SEC);
  const targetBagStretch = 1 + 0.055 * nextPreSwing * (1 - nextProgress) + (0.145 * nextTension + 0.165 * nextForce + 0.055 * chargeRatio + yankStretchPulse) * nextProgress;
  const prevStretch = state.bagStretchRatio ?? 1;
  const stretchSmoothing = 1 - Math.pow(1 - 0.26, frameSteps);
  const rawNextStretch = prevStretch + (targetBagStretch - prevStretch) * stretchSmoothing;
  const nextBagStretchRatio = !state.dragging && Math.abs(rawNextStretch - 1) < 0.003 ? 1 : rawNextStretch;
  const nextBagSquashRatio = nextBagStretchRatio === 1 ? 1 : 1 / Math.pow(Math.max(0.75, nextBagStretchRatio), 0.42);

  if (nextHighForceHoldSec >= SNATCH_HOLD_DURATION_SEC && nextProgress >= 0.75) {
    const initialBagX = state.pointerX ?? BAG3_HANDLE_APEX.x + netOffsetX - 35;
    const initialBagY = state.pointerY ?? BAG3_HANDLE_APEX.y + netOffsetY + 35;
    return {
      ...state,
      preSwingProgress: 1,
      preSwingDy: nextPreDy,
      crossedCenter: true,
      progress: 1,
      bagAngleDeg: nextAngleDeg,
      pullTension: nextTension,
      pullForce: nextForce,
      resistanceFactor: nextResistance,
      highForceHoldSec: nextHighForceHoldSec,
      snatched: true,
      snatchElapsedSec: 0,
      postSnatchPhase: 'raising',
      pose4ToPose1Progress: 0,
      pose1ToPose2Progress: 0,
      sweatDropProgress: 0,
      snatchedBagX: BAG3_HANDLE_APEX.x + netOffsetX,
      snatchedBagY: BAG3_HANDLE_APEX.y + netOffsetY + 38,
      pointerX: initialBagX,
      pointerY: initialBagY,
      snatchedBagVelX: 0,
      snatchedBagAngleDeg: BAG1_TO_BAG3_ROT_DEG + nextAngleDeg,
      bagStretchRatio: Math.max(1.26, nextBagStretchRatio),
      bagSquashRatio: Math.min(0.9, nextBagSquashRatio),
      netOffsetX,
      netOffsetY,
      struggleAngleOffsetDeg: 0,
      sakuraBraceX,
      sakuraBraceY
    };
  }

  return {
    ...state,
    preSwingProgress: nextPreSwing,
    preSwingDy: nextPreDy,
    crossedCenter: constraint.hasCrossedCenter,
    progress: nextProgress,
    bagAngleDeg: nextAngleDeg,
    pullTension: nextTension,
    pullForce: nextForce,
    resistanceFactor: nextResistance,
    highForceHoldSec: nextHighForceHoldSec,
    snatched: false,
    snatchElapsedSec: 0,
    postSnatchPhase: 'none',
    pose4ToPose1Progress: 0,
    pose1ToPose2Progress: 0,
    sweatDropProgress: 0,
    bagStretchRatio: nextBagStretchRatio,
    bagSquashRatio: nextBagSquashRatio,
    netOffsetX,
    netOffsetY,
    struggleAngleOffsetDeg,
    sakuraBraceX,
    sakuraBraceY
  };
}

function drawStaticLayer(targetCtx, layer, skipAhoge = false, ignoreClip = false) {
  if (!layer || !layer.visible) return;
  targetCtx.save();
  if (layer.clip && !ignoreClip) {
    const pairs = layer.clip.trim().split(/\s+/).map((p) => p.split(',').map(Number));
    if (pairs.length >= 3) {
      targetCtx.beginPath();
      targetCtx.moveTo(pairs[0][0], pairs[0][1]);
      for (let i = 1; i < pairs.length; i++) {
        targetCtx.lineTo(pairs[i][0], pairs[i][1]);
      }
      targetCtx.closePath();
      targetCtx.clip();
    }
  }
  for (const shape of layer.fills) {
    targetCtx.fillStyle = shape.fill;
    targetCtx.fill(new Path2D(shape.d), shape.rule || 'nonzero');
  }
  if (layer.strokes.length > 0) {
    targetCtx.strokeStyle = STROKE_COLOR;
    targetCtx.lineWidth = 12;
    targetCtx.lineCap = 'round';
    targetCtx.lineJoin = 'round';
    for (const d of layer.strokes) {
      if (skipAhoge && d === AHOGE_PATH_D) continue;
      targetCtx.stroke(new Path2D(d));
    }
  }
  if (layer.groups) {
    targetCtx.lineCap = 'round';
    targetCtx.lineJoin = 'round';
    for (const group of layer.groups) {
      targetCtx.strokeStyle = group.color;
      targetCtx.lineWidth = group.width;
      for (const d of group.paths) {
        targetCtx.stroke(new Path2D(d));
      }
    }
  }
  targetCtx.restore();
}

function drawLayerForcedVisible(targetCtx, layer, ignoreClip = false) {
  if (!layer) return;
  drawStaticLayer(targetCtx, { ...layer, visible: true }, false, ignoreClip);
}

function drawArmLayerWithIdleLift(targetCtx, layer, armLiftX, armLiftY, liftBothArms) {
  if (!layer || !layer.visible) return;
  if (Math.abs(armLiftX) < 0.01 && Math.abs(armLiftY) < 0.01) {
    drawStaticLayer(targetCtx, layer, false);
    return;
  }
  for (const shape of layer.fills) {
    const isRightArm = liftBothArms || shape.id.includes('right');
    targetCtx.save();
    if (isRightArm) targetCtx.translate(armLiftX, armLiftY);
    targetCtx.fillStyle = shape.fill;
    targetCtx.fill(new Path2D(shape.d), shape.rule || 'nonzero');
    targetCtx.restore();
  }
  if (layer.strokes.length > 0) {
    for (let idx = 0; idx < layer.strokes.length; idx++) {
      const d = layer.strokes[idx];
      const isRightStroke = liftBothArms || idx >= 1;
      targetCtx.save();
      if (isRightStroke) targetCtx.translate(armLiftX, armLiftY);
      targetCtx.strokeStyle = STROKE_COLOR;
      targetCtx.lineWidth = 12;
      targetCtx.lineCap = 'round';
      targetCtx.lineJoin = 'round';
      targetCtx.stroke(new Path2D(d));
      targetCtx.restore();
    }
  }
}
