[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "m.a.t.o.u"
version = "0.9.0"
description = "A completely useless TYPE-MOON fan-made toy."
readme = { file = "README.md", content-type = "text/markdown; charset=UTF-8" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["m.a.t.o.u", "matou", "fan-made", "toy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/xh10032/kenageya"
Repository = "https://github.com/xh10032/kenageya"
Issues = "https://github.com/xh10032/kenageya/issues"

[project.scripts]
"m.a.t.o.u" = "matou:main"
"m-a-t-o-u" = "matou:main"
matou = "matou:main"

[tool.setuptools]
packages = ["matou"]
